<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset ="utf-8">
        <title>
            India Flag
        </title>
        <style>
            .Flag{
                position: absolute;
                background-color: #FF9933;
                width: 900px;
                height: 600px;
                border: 2px solid black
            }
            .Flag>div>div{
                position: relative;
                background-color: #128807;
                height: 200px;
                width: 900px;
                top: 200px;
            }
            .Flag>div{
                position: absolute;
                background-color: white;
                height: 200px;
                width: 900px;
                top:200px;
            }
            img{
                position: absolute;
                width: 180px;
                height: 180px;
                left: 360px;
                top: 10px;
            }
            h1{
                font-size: 5rem;
            }
        </style>
    </head>
    <body>
        <h1>Indian Flag</h1>
        <div class = "Flag">
            <div>
                <img src = "./Ashoka Chakra.png" alt="Indian Flag With Ashoka Chakra"/>
                <div></div>>
            </div>
        </div>
    </body>
</html>
